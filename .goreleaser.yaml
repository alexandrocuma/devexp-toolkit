version: 2

project_name: devexp-toolkit

before:
  hooks:
    - ./scripts/stage-assets.sh

builds:
  - id: devexp
    dir: ./cli
    main: .
    binary: devexp
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X devexp/cmd.version={{ .Version }}

archives:
  - id: devexp
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  # /release creates the GitHub Release as a draft (docs/guides/release.md,
  # Cut). goreleaser finds that draft by name ({{.Tag}}), keeps its notes,
  # uploads the assets, then publishes it, so the release is never public
  # without assets.
  use_existing_draft: true
  github:
    owner: alexandrocuma
    name: devexp-toolkit
