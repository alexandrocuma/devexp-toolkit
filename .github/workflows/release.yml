name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # The whole ci workflow — Go tests, the three script suites and the
  # vulnerability scan — on the tagged commit (a local `uses:` path resolves at
  # the caller's ref). Defined once, in ci.yml; nothing is copied here. The
  # call succeeds only when every job inside it does, and it inherits this
  # workflow's read-only token.
  ci:
    uses: ./.github/workflows/ci.yml

  goreleaser:
    # A failing test suite or a called vulnerability skips this job, so a tag
    # whose commit doesn't pass CI publishes nothing.
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
