name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Weekly run of the whole suite on the default branch. Without it an advisory
  # published while `main` is quiet waits for the next push, PR or tag; a
  # failure here is a red `ci` run on `main`. The jobs are defined once — a
  # scan-only workflow would be a second copy of `govulncheck` — and the two
  # test jobs cost little and also catch drift in the runner image and the
  # pinned actions.
  schedule:
    - cron: "27 6 * * 1" # Mondays 06:27 UTC
  # Manual re-run of the same suite: after the 60-day auto-disable, or to scan a
  # freshly published advisory without waiting for Monday. The schedule is
  # otherwise the only unattended trigger, and a run that never starts is the
  # one failure mode that raises no alarm.
  workflow_dispatch:
  # Called by release.yml on a `v*` tag, so the same jobs gate the publish.
  workflow_call:

# Every job here only reads the repo, including `govulncheck`, which repeats
# this at job level so the scan's scope is legible where it runs. goreleaser,
# the one job that writes, is in release.yml and raises this for itself.
# A caller can only lower these, never raise them.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: stage assets
        run: ./scripts/stage-assets.sh
      # -count=1 is a no-op here: a fresh runner has an empty cache, so CI
      # always executes. It is present so this line and the command the docs
      # tell a developer to run are the SAME command. Locally the flag is
      # load-bearing — the repo-consistency tests read assets from outside
      # the module root, those reads are not part of the cache key, and a
      # plain run answers an asset edit with a cached pass.
      - name: go test
        working-directory: cli
        run: go test ./... -race -cover -count=1

  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: claude-code hook tests
        run: |
          for f in hooks/claude-code/*.test.sh; do
            echo "== $f"; bash "$f" || exit 1
          done
      - name: kimi hook tests
        run: |
          for f in hooks/kimi/*.test.sh; do
            echo "== $f"; bash "$f" || exit 1
          done
      - name: opencode hook tests
        run: |
          for f in hooks/opencode/*.test.js; do
            echo "== $f"; node "$f" || exit 1
          done
      - name: installer script tests
        run: |
          for f in ./*.test.sh; do
            [ -e "$f" ] || continue
            echo "== $f"; bash "$f" || exit 1
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      # The embed directives under cli/internal/assets/ point at staged files
      # that are gitignored, so the package does not type-check in a fresh
      # clone — and a linter that cannot build a package reports no problems
      # in it, which reads exactly like a clean run.
      - name: stage assets
        run: ./scripts/stage-assets.sh
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
          working-directory: cli
          args: --config=../.golangci.yml
      # The comment standard spans Go, bash and JS, so it is checked by a
      # language-agnostic scanner rather than a Go linter: a Go linter could
      # only ever hold the rule in cli/ and would abandon it in the hooks.
      # Needs no toolchain beyond python3.
      - name: comment references
        run: ./scripts/check-comment-refs.sh

  govulncheck:
    runs-on: ubuntu-latest
    # Same as the workflow default above, restated because this is the job that
    # fetches and evaluates third-party advisory data.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      # Pinned version, platforms and exit codes live in the script:
      # 3 = called vulnerability, any other failure = infrastructure.
      - name: govulncheck
        run: ./scripts/govulncheck.sh
