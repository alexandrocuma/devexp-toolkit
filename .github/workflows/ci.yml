name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: cli/go.sum
      - name: stage assets
        run: ./scripts/stage-assets.sh
      - name: go test
        working-directory: cli
        run: go test ./... -race -cover
