# golangci-lint configuration for the Go CLI under cli/.
#
# Scope: this file governs THIS repository's own installer binary. It has
# nothing to do with what the toolkit ships. The agents, skills and hooks under
# agents/, skills/ and hooks/ run against users' projects in whatever language
# those are written in, and a rule that has to travel is written as a review
# question in the skill, not as a linter here.
#
# This is deliberately minimal: errcheck, and the annotation discipline that
# makes errcheck's escape hatch honest. It is a floor to build on, not the
# finished linter set.
version: "2"

linters:
  default: none
  enable:
    # The rule this repo has broken three separate times: a failure collapsed
    # into a value that looks like success. Each instance had the same shape —
    # an error or a no-op converted into a success-looking value, and the
    # caller proceeding as if nothing happened. An unparseable registry was
    # indistinguishable from a build shipping no MCPs. A nil manifest was
    # dereferenced because the error beside it was dropped. A grant step wrote
    # a file, exited 0, and granted nothing.
    - errcheck

    # errcheck alone would be worse than useless here, because the escape hatch
    # would absorb the rule. Discarding an error is sometimes CORRECT in this
    # codebase and documented as policy: loading state never blocks an install,
    # so a malformed settings file counts as empty, with a warning. The rule is
    # not "never discard an error" — it is "a discarded error is allowed only
    # where a comment states why, and only where the caller still reports the
    # degraded state".
    #
    # nolintlint is what makes the first half enforceable: a bare
    # //nolint:errcheck is rejected, so every suppression has to say what the
    # user still sees. The second half cannot be checked mechanically and lives
    # in /deliver's Phase 5 review question instead.
    - nolintlint

    # Every exported symbol carries a doc comment. It is the one gap a reader
    # cannot close by reading the code: an unexported helper can be understood
    # from its body, while an exported one is read by someone who has decided
    # not to. Only the `exported` rule is on — revive's default set is a style
    # opinion this repo has not taken.
    - revive

  settings:
    errcheck:
      # A type assertion that fails yields the zero value, which is the same
      # "failure that looks like success" in a different costume.
      check-type-assertions: true
      # `x, _ := f()` is an explicit, visible decision at the call site, and it
      # already reads as deliberate. Requiring an annotation on it too would
      # produce noise without adding information.
      check-blank: false

    revive:
      rules:
        # See docs/development/conventions.md ("Comments") for the bar a doc
        # comment has to clear: it says what the signature cannot, and a
        # restatement of the name is deleted rather than kept.
        - name: exported

    nolintlint:
      # The whole point. `//nolint:errcheck` with no explanation records that
      # someone silenced the linter, not why, which is exactly the state this
      # repo keeps rediscovering.
      require-explanation: true
      # `//nolint` with no linter named suppresses everything, including linters
      # added later, at a line nobody revisits.
      require-specific: true
      allow-unused: false

  exclusions:
    generated: lax
    rules:
      # Tests are excluded, deliberately and with a limit.
      #
      # In production, a discarded error is dangerous precisely because nothing
      # downstream notices. In a test, a discarded setup error is caught by the
      # assertion that follows it: a `t.MkdirAll` that silently failed produces a
      # failing test, loudly, at the point of the check. The risk this linter
      # exists to catch is a production property.
      #
      # The limit: this does NOT cover a test that would pass vacuously because
      # its setup never happened. That is a real failure mode, it is not what
      # errcheck detects, and it is not in this file's scope.
      - path: _test\.go
        linters:
          - errcheck
          - nolintlint

issues:
  # Both default to a cap (50 per linter, 3 per identical message), and a
  # capped run reports a clean-looking subset while the rest go unmentioned.
  # For this linter set that would be the exact defect it was added to catch:
  # the tool finds a problem, the output looks manageable, and nobody learns
  # the count was 21. Report everything.
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    # Formatting should never reach a review comment, and gofmt is the one
    # formatting question Go does not leave open.
    - gofmt
