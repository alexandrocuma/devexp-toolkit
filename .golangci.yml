# golangci-lint config for the Go CLI in cli/.
#
# Repo-local, and deliberately so: this is the one part of devexp that is a Go
# program rather than an asset shipped into someone else's project. The comment
# standard that spans Go, bash and JS is enforced by
# scripts/check-comment-refs.sh, which is language-agnostic; this file only
# covers the Go hygiene that needs a Go-aware parser.
#
# Narrow on purpose. The default linter set is off and two things are on:
# gofmt, because formatting should never be a review comment, and revive's
# `exported` rule, because an undocumented exported symbol is the one gap a
# reader cannot close by reading the code. Widen deliberately, one rule at a
# time, with the tree already clean for it.
#
# Run: golangci-lint run   (from cli/, or the repo root)
version: "2"

linters:
  default: none
  enable:
    - revive
  settings:
    revive:
      rules:
        # Every exported symbol carries a doc comment, in Go's own form.
        # See docs/development/conventions.md ("Comments").
        - name: exported
  exclusions:
    # A gitignored mirror of the repo's assets, regenerated by
    # scripts/stage-assets.sh. Not source, and not ours to format.
    paths:
      - cli/internal/assets

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - cli/internal/assets
